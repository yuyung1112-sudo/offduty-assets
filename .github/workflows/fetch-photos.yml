# Downloads licensed Wikimedia Commons photos (lines "dest|File_name.jpg", separated by ";").
name: fetch-photos
on:
  workflow_dispatch:
    inputs:
      list: {required: true}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download photos
        env:
          LIST: ${{ inputs.list }}
        run: |
          set -euo pipefail
          IFS=';' read -ra ITEMS <<< "$LIST"
          for item in "${ITEMS[@]}"; do
            dest="${item%%|*}"; file="${item#*|}"
            mkdir -p "$(dirname "photos/$dest")"
            curl -fsSL -A "ConcreteArchive/0.1" -o "photos/$dest" \
              "https://commons.wikimedia.org/wiki/Special:FilePath/$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' "$file")?width=1600"
          done
          ls -laR photos
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898599+github-actions[bot]@users.noreply.github.com"
          git add photos
          git commit -m "Add source photos from Wikimedia Commons" || echo "nothing to commit"
          git push
